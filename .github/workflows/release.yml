# Publishes a GitHub Release whenever package.json has a version that isn't released yet.
# To cut a release: bump "version" in package.json and add a matching "## [x.y.z]" section
# to CHANGELOG.md, then merge to main. The tag goes on the commit that set the version.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read version
        id: v
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Skip if already released
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${{ steps.v.outputs.tag }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "${{ steps.v.outputs.tag }} is already released."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build release notes from CHANGELOG.md
        if: steps.check.outputs.exists == 'false'
        run: |
          VERSION="${{ steps.v.outputs.version }}"
          awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" { on=1; next }
            on && /^## / { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "::error::CHANGELOG.md has no '## [$VERSION]' section."
            exit 1
          fi
          {
            echo
            echo "**Website:** https://mvpoirier.github.io/mvplanner/"
            echo
            echo "Full history: [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md)"
          } >> notes.md

      - name: Publish release
        if: steps.check.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ steps.v.outputs.version }}"
          # Tag the commit where package.json first got this version.
          TARGET=$(git log --reverse --format=%H -S"\"version\": \"$VERSION\"" -- package.json | head -1)
          TARGET=${TARGET:-$GITHUB_SHA}
          gh release create "v$VERSION" --target "$TARGET" \
            --title "MVPlanner v$VERSION" --notes-file notes.md --latest
